# biomedclip — representation RESOLVED by D-018 (pre-projection, uniform across all VLMs).
backbone:
  name:       biomedclip
  family:     medical_vlm
  variant:    "BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"   # VERIFY exact hub string
  loader:     open_clip
  checkpoint: "hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"   # VERIFY
  embed_dim:  768        # VERIFY — ViT-B/16 pre-projection. Projected (~512) is NOT used.
  activation: gelu

  representation:
    status:  RESOLVED
    forward: "image tower forward, PRE-projection"
    pooling: cls
    rationale: >
      Pre-projection per D-018. Uniform with MONET, SigLIP and OpenCLIP — an inconsistent extraction
      rule across the four VLMs would confound both VLM cells.

preprocessing: {asset: assets/preprocessing/biomedclip.json, sha256: null, source: null}

intervention:
  r: null
  lambda_proj: null
  grid: {r: [16, 32, 64, 128], lambda_proj: [0.1, 1, 5]}
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  Cell partner is MONET (ViT-L/14). This cell spans {B, L}, which D-022 mirrors in the general-VLM
  cell so the medical-vs-general VLM contrast is scale-controlled by construction.
