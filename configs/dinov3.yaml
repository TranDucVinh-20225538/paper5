# dinov3 — see _template.yaml for field semantics and rules.
# null = decision not made. The pipeline must refuse to run, not fill it in.

backbone:
  name:       dinov3
  family:     general_ssl
  variant:    facebook/dinov3-vitl16-pretrain-lvd1689m  (ViT-L/16, LVD-1689M)
  loader:     hf          # D-045 — NOT timm: timm 0.9.16 cannot build dinov3
  checkpoint: "facebook/dinov3-vitl16-pretrain-lvd1689m"
  revision:   ea8dc2863c51be0a264bab82070e3e8836b02d51   # D-044 — immutable. NEVER a branch.
  embed_dim:  1024        # ViT-L; VERIFY with one forward pass
  activation: gelu

  representation:
    status:    RESOLVED
    forward:   "vision transformer forward -> CLS token"
    pooling:   cls
    rationale: >
      CLS token is the conventional choice; confirm against the published linear-probe recipe, and decide explicitly whether patch tokens are mean-pooled and concatenated as some recipes do.

preprocessing:
  asset:  assets/preprocessing/dinov3.json
  sha256: null      # PENDING — filled at freeze time
  source: null      # PENDING — cite the published eval transform

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  D-005 CLOSED by D-015 — cell partner is MoCo v3, NOT DINOv2. DINOv2 was rejected as same-lineage: it would measure scaling variance and report it as family variance. Variant still to pin; pin ViT-L so the cell spans {L, B} and record embed_dim.

license:
  spdx: dinov3-license
  release_tier: B    # conditional — Agreement copy + 'Built with DINOv3' + acknowledge in publication

pretraining_note:
  base_model: facebook/dinov3-vit7b16-pretrain-lvd1689m
  distilled: true
  detail: >
    Confirmed 2026-08-12 from the model card and the HF base_model field: only DINOv3 ViT-7B is
    trained from scratch. All five ViT variants (S/S+/B/L/H+) and all four ConvNeXt variants are
    DISTILLED from it, so ViT-L/16 inherits the 7B's representation rather than learning one
    independently.

    Not a choice point — every deployable DINOv3 variant is distilled, and DINOv2 has the same
    structure (ViT-g trained, S/B/L distilled), so this does not reopen D-015.

    Recorded because it touches the primary covariate directly: kappa is a SPECTRAL property and
    distillation is known to reshape eigenvalue spectra. The general-SSL cell therefore pairs a
    distilled model (DINOv3 ViT-L) with a directly-trained one (MoCo v3 ViT-B). If DINOv3's geometry
    behaves unlike the rest of the set, this is the first thing to point at — and it needs to be on
    record BEFORE the result, not offered afterwards.
