# efficientnet_b3 — see _template.yaml for field semantics and rules.
# null = decision not made. The pipeline must refuse to run, not fill it in.

backbone:
  name:       efficientnet_b3
  family:     cnn
  variant:    efficientnet_b3
  loader:     timm
  checkpoint: timm/efficientnet_b3.ra2_in1k
  embed_dim:  1536
  activation: silu

  representation:
    status:    RESOLVED
    forward:   model.forward_features(x) -> global_pool
    pooling:   gap
    rationale: >
      Standard global average pool over the final conv stage.

preprocessing:
  asset:  assets/preprocessing/efficientnet_b3.json
  sha256: 20dcfeffa5d3e3169a631fdee01da15fb94032e0ddbac2c6e5f1609d139969a1
  source: timm ImageNet eval (Resize 256, CenterCrop 224)

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  Matched-backbone control already present in the CSG-Skin / DST-Skin infrastructure. SiLU/Swish activation — again, match it.
