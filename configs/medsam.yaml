# medsam — see _template.yaml for field semantics and rules.
# null = decision not made. The pipeline must refuse to run, not fill it in.

backbone:
  name:       medsam
  family:     PROBE          # D-016 — NOT a family member. Excluded from the family-level model.
  variant:    MedSAM ViT-B image encoder
  loader:     medsam
  checkpoint: null
  embed_dim:  768          # pre-neck; VERIFY with one forward pass
  activation: gelu

  representation:
    status:    RESOLVED      # D-025, D-026
    forward:   "image_encoder(x) -> PRE-NECK tokens 64x64x768, then masked GAP"
    pooling:   gap_masked
    rationale: >
      OPEN. Segmentation-oriented encoder — emits a spatial feature map, not a pooled vector. Which tensor becomes 'the embedding', and how it is pooled, must be decided and written down BEFORE extraction. embed_dim stays null until that is settled, since it follows from the choice.

preprocessing:
  asset:  assets/preprocessing/medsam.json
  sha256: null      # PENDING — filled at freeze time
  source: null      # PENDING — cite the published eval transform

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  D-016: reclassified out of the medical-SSL cell. MedSAM is supervised segmentation (SAM fine-tuned on medical masks), NOT self-supervised — it shares only 'medical' and 'image-only' with PanDerm, so keeping it in an SSL-named cell would break the homogeneity the family contrast assumes. Retained as a declared architecture-portability probe: full ladder, per-backbone analysis, EXCLUDED from the family model and from every outcome-taxonomy denominator. Run it FIRST — it is the structurally most different encoder in the set and the cheapest place to discover the recipe does not port. Representation choice is still open: see docs/medsam_integration.md (Task 4).
