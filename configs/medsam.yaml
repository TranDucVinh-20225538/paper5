# medsam — D-016 architecture-portability probe (excluded from family model).
# D-025 pre-neck 768-d + D-026 masked GAP. Checkpoint: wanglab/medsam-vit-base.
backbone:
  name:       medsam
  family:     PROBE
  variant:    MedSAM ViT-B image encoder
  loader:     medsam
  checkpoint: "wanglab/medsam-vit-base"
  embed_dim:  768
  activation: gelu

  representation:
    status:    RESOLVED
    forward:   "image_encoder(x) -> PRE-NECK tokens 64x64x768, then masked GAP"
    pooling:   gap_masked
    rationale: >
      Pre-neck 768-d by D-018 extension; neck is segmentation projection head. Masked GAP over
      valid (non-padded) patches per D-026.

preprocessing:
  asset:  assets/preprocessing/medsam.json
  sha256: fbcf2ba867421a9bfbcf048df6ad7c00a1f41a66812520b5a052bdebdff80b1b
  source: "MedSAM 1024 eval transform frozen 2026-08-12"

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  D-016: reclassified out of the medical-SSL cell. Excluded from family-level model. Highest
  extraction cost in the set (1024 input). See docs/medsam_integration.md.
