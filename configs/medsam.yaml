# medsam — D-016 architecture-portability probe (excluded from family model).
# D-025 pre-neck 768-d + D-026 masked GAP. Checkpoint: wanglab/medsam-vit-base.
backbone:
  name:       medsam
  family:     PROBE
  variant:    MedSAM ViT-B image encoder
  loader:     medsam      # transformers SamModel underneath
  checkpoint: "wanglab/medsam-vit-base"
  revision:   de8488bca37bb1d4fb190f612c516126d739ce3b   # D-044 — immutable. NEVER a branch.
  embed_dim:  768
  activation: gelu

  representation:
    status:    RESOLVED
    forward:   "image_encoder(x) -> PRE-NECK tokens 64x64x768, then masked GAP"
    pooling:   gap_masked
    rationale: >
      Pre-neck 768-d by D-018 extension; neck is segmentation projection head. Masked GAP over
      valid (non-padded) patches per D-026.

preprocessing:
  asset:  assets/preprocessing/medsam.json
  sha256: dfb78e884c1e8f0208a22f3dcc9855596a08a2d340c90a64f5b01e5cc7677f67
  source: "MedSAM 1024 eval transform frozen 2026-08-12"

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  D-016: excluded from family-level model. Highest extraction cost in the set (1024 input).
  See docs/medsam_integration.md.

license:
  spdx: apache-2.0
  release_tier: A    # unrestricted redistribution

assertions:
  embed_dim_must_be: 768   # D-043 — PRE-neck. 256 means the neck ran: WRONG (D-025).
  why: >
    transformers SamVisionEncoder.forward applies the neck INSIDE the forward pass, so the obvious
    API call returns post-neck 256-d — the representation D-025 rejected. The failure is silent:
    no exception, no warning, a plausible shape, the wrong tensor.
