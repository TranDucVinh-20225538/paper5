# mocov3 — D-015. Chosen over DINOv2 to avoid same-lineage under-sampling of within-family variance.
# D-042: nyu-visionx/moco-v3-vit-b mirror verified (see docs/decisions/D-042-mocov3-provenance.md).
backbone:
  name:       mocov3
  family:     general_ssl
  variant:    MoCo v3 ViT-B/16 (300-epoch IN1K)
  loader:     hf          # transformers format (D-045)
  checkpoint: "nyu-visionx/moco-v3-vit-b"
  revision:   7d091cd70772c5c0ecf7f00b5f12ca609a99d69d   # D-044 — immutable. NEVER a branch.
  embed_dim:  768
  activation: gelu

  representation:
    status:  RESOLVED
    forward: "vision transformer forward -> CLS token"
    pooling: cls
    rationale: >
      CLS token, matching the published linear-probe recipe.

preprocessing:
  asset:  assets/preprocessing/mocov3.json
  sha256: ef541f33ebdaae9db0884aae938e61516fb1c1acd140e8ea20e1bee342d98c01
  source: "MoCo v3 linear-probe eval transform frozen 2026-08-12"

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  Objective is instance-contrastive, deliberately different from DINOv3's self-distillation.

license:
  spdx: cc-by-nc-4.0
  release_tier: B    # conditional — see D-046

provenance:
  status: VERIFIED       # D-042 — safetensors load into vit_base_patch16_224, 0 missing keys
  mirror: nyu-visionx/moco-v3-vit-b
  canonical: facebookresearch/moco-v3 vit-b-300ep.pth
  detail: >
    FAIR CDN returned 403 from study server; mirror weights SHA256 pinned in
    assets/preprocessing/mocov3.json. See docs/decisions/D-042-mocov3-provenance.md.
