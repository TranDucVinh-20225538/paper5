# panderm — see _template.yaml for field semantics and rules.
# null = decision not made. The pipeline must refuse to run, not fill it in.

backbone:
  name:       panderm
  family:     medical_ssl
  variant:    PanDerm_Large_LP
  loader:     panderm
  checkpoint: "assets/checkpoints/panderm_vitl16_checkpoint-499.pth"   # real filename on disk
  checkpoint_sha256: 23405e92f853c6f7ac9da80ccf4cfde84d4feb22cd9d7b98c7e850e3875554b2   # D-044 — local file, so a hash replaces an HF revision
  embed_dim:  1024
  activation: gelu

  representation:
    status:    RESOLVED
    forward:   model.forward_features(x, is_train=False)
    pooling:   none
    rationale: >
      Pinned in Paper 4. 1024-d vector straight out of forward_features, no CLS/pooling ambiguity.

preprocessing:
  asset:  assets/preprocessing/panderm.json
  sha256: a92ffcd606347632c4cfae8243ea2c987708d58d9676d861a9844f0a6ebdff72
  source: Paper4/PhaseB/assets/reference_preprocessing.json (PanDerm get_eval_transforms, imagenet norm)

intervention:
  r:           16
  lambda_proj: 0.1
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  optimizer:    adamw
  lr:           1.0e-3
  batch_size:   512
  epochs:       100
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  Paper 4 anchor. r/lambda already won their pre-committed grid HERE, so they are not null. Frozen embeddings exist at Paper4/PhaseB/assets/reference_embeddings/ and are reusable without rerunning extraction. Still rerun the full ladder: Paper 4 ran only one point of the causal design on it in the FM setting.

provenance:
  note: >
    D-044: PanDerm is the one backbone Paper 5 does NOT extract. Protocol Step 3 reuses Paper 4's
    frozen embeddings (src/utils/paths.py::load_panderm_embeddings_root), so the checkpoint above is
    never loaded here — it is recorded for provenance only, and the filename was corrected on
    2026-08-12 after the config was found to name a file that does not exist on disk.
    The operative pin for this backbone is the sha256 of the reused embedding arrays, which the
    extraction manifest already records.
