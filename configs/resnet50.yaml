# resnet50 — see _template.yaml for field semantics and rules.
# null = decision not made. The pipeline must refuse to run, not fill it in.

backbone:
  name:       resnet50
  family:     cnn
  variant:    resnet50
  loader:     timm
  checkpoint: timm/resnet50.a1_in1k
  embed_dim:  2048
  activation: relu

  representation:
    status:    RESOLVED
    forward:   model.forward_features(x) -> global_pool
    pooling:   gap
    rationale: >
      Standard global average pool over the final conv stage. Unambiguous.

preprocessing:
  asset:  assets/preprocessing/resnet50.json
  sha256: null      # PENDING — filled at freeze time
  source: null      # PENDING — cite the published eval transform

intervention:
  r:           null
  lambda_proj: null
  grid:
    r:           [16, 32, 64, 128]
    lambda_proj: [0.1, 1, 5]
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  Papers 1-3 baseline. Reuses an existing checkpoint. Note the activation is ReLU, not GELU — the adapter must match it.
