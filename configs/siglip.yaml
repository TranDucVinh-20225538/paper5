# siglip — ViT-L/16 per D-022 (was ViT-B/16; revised after MONET confirmed as ViT-L/14).
backbone:
  name:       siglip
  family:     general_vlm
  variant:    "google/siglip-large-patch16-256"   # VERIFY — must be the ViT-L variant, not base
  loader:     hf
  checkpoint: "google/siglip-large-patch16-256"   # VERIFY
  revision:   d0da9f876e7d66b4e250cd2450c3ba2ce735e447   # D-044 — immutable. NEVER a branch.
  embed_dim:  1024       # VERIFY — ViT-L pre-projection
  activation: gelu

  representation:
    status:  RESOLVED
    forward: "vision tower forward, PRE-projection"
    pooling: attn_pool
    rationale: >
      SigLIP uses an attention-pooling (MAP) head, NOT a CLS token — do not assume CLS. Take the
      pooled output before the projection head, per D-018.

preprocessing: {asset: assets/preprocessing/siglip.json, sha256: null, source: null}

intervention:
  r: null
  lambda_proj: null
  grid: {r: [16, 32, 64, 128], lambda_proj: [0.1, 1, 5]}
  nuisance_direction: {formula: unit(mu_ISIC - mu_PAD), learned: false}
  alpha_ladder: [0.0, 0.25, 0.5, 0.75, 1.0]

seeds: [42, 52, 62, 72, 82]

notes: >
  D-022: pinned at ViT-L to mirror MONET, so both VLM cells carry one ViT-B and one ViT-L. Objective
  is sigmoid pairwise contrastive, vs OpenCLIP's softmax contrastive — that is the within-cell spread.

license:
